<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trace film (frame-rendered)</title>
<style>
  :root{--sky:#5db2ff;--ice:#bfe6ff;--blue:#2f8bff;--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif}
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 50% 28%,#0e1b30 0%,#060a13 55%,#03050a 100%);font-family:var(--f);color:#f4f6fb}
  #stars{position:absolute;inset:0}
  #world{position:absolute;inset:0;transform-origin:50% 50%}
  svg{position:absolute;inset:0;overflow:visible}
  .abs{position:absolute;left:0;right:0;text-align:center}
  .title{top:560px;font-weight:700;font-size:132px;line-height:1.02;letter-spacing:-.045em;padding:0 70px}
  .title .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
  .title .w span{display:inline-block;will-change:transform}
  .eyebrow{top:470px;font-weight:600;font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--sky)}
  .phone{position:absolute;left:220px;top:290px;width:640px;height:1390px;border-radius:100px;padding:17px;background:linear-gradient(145deg,#3a3f4a,#0d0f14 40%,#2a2e38);box-shadow:0 0 0 2px rgba(255,255,255,.18) inset,0 80px 160px -30px rgba(0,0,0,.9);transform-origin:50% 50%}
  .phone .scr{position:relative;width:100%;height:100%;border-radius:84px;overflow:hidden;background:#000}
  .phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .phone .isl{position:absolute;top:34px;left:50%;width:172px;height:44px;margin-left:-86px;background:#000;border-radius:99px}
  .glow{position:absolute;left:60px;top:300px;width:960px;height:1300px;background:radial-gradient(closest-side,rgba(93,178,255,.42),transparent 70%);filter:blur(40px)}
  .chip{position:absolute;width:300px;padding:14px 14px 18px;border-radius:44px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(30px);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);font-weight:600;font-size:28px;line-height:1.2;transform-origin:50% 50%}
  .chip img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:30px;margin-bottom:14px}
  .chip span{padding:0 8px}
  .cap{text-shadow:0 6px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.45);left:70px;right:70px;bottom:150px;text-align:center;font-weight:700;font-size:84px;line-height:1.06;letter-spacing:-.04em}
  .cap small{display:block;margin-top:22px;font-weight:500;font-size:38px;letter-spacing:-.01em;color:rgba(244,246,251,.68)}
  .big{font-weight:700;font-size:300px;letter-spacing:-.06em;line-height:1;color:var(--sky)}
  .lab{font-weight:600;font-size:56px;letter-spacing:-.02em;margin-top:-6px;color:#f4f6fb}
  .row{position:absolute;left:0;right:0;text-align:center}
  .btn{position:absolute;left:50%;top:1290px;transform:translateX(-50%);height:132px;padding:0 84px;border-radius:99px;background:linear-gradient(180deg,#3b97ff,#1f72f0);box-shadow:0 30px 80px -20px rgba(47,139,255,.9);font-weight:600;font-size:54px;line-height:132px;white-space:nowrap}
  .icon{position:absolute;left:50%;top:560px;width:260px;height:260px;margin-left:-130px;border-radius:60px;box-shadow:0 40px 120px -10px rgba(47,139,255,.7)}
  .brand{top:880px;font-weight:700;font-size:170px;letter-spacing:-.05em}
  .sub{top:1090px;font-weight:500;font-size:46px;color:rgba(244,246,251,.7);padding:0 100px}
  .fine{top:1480px;font-size:34px;color:rgba(244,246,251,.5)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars" width="1080" height="1920"></canvas>
  <div id="world">
    <svg id="svg" viewBox="0 0 1080 1920" width="1080" height="1920">
      <defs>
        <linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#5db2ff" stop-opacity="0"/><stop offset=".3" stop-color="#5db2ff"/><stop offset="1" stop-color="#9be7ff"/></linearGradient>
        <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path id="routeBase" d="M-60 1560 C 120 1480, 220 1180, 420 1220 S 760 1600, 960 1280 S 1100 700, 1160 520" fill="none" stroke="url(#rg)" stroke-width="5" stroke-dasharray="4 20" stroke-linecap="round" opacity=".45"/>
      <path id="route" d="M-60 1560 C 120 1480, 220 1180, 420 1220 S 760 1600, 960 1280 S 1100 700, 1160 520" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" filter="url(#gl)"/>
      <circle id="head" r="16" fill="#fff" filter="url(#gl)"/>
    </svg>
    <div class="glow" id="glow"></div>
    <div class="abs eyebrow" id="eyebrow"></div>
    <div class="abs title" id="title"></div>
    <div class="phone" id="phone"><div class="scr">
      <video id="vStd" muted playsinline preload="auto"></video>
      <video id="vSat" muted playsinline preload="auto" style="opacity:0"></video>
    </div><i class="isl"></i></div>
    <div class="chip" id="chipA"><img id="imgA"><span id="nameA"></span></div>
    <div class="chip" id="chipB"><img id="imgB"><span id="nameB"></span></div>
    <div class="chip" id="chipC"><img id="imgC"><span id="nameC"></span></div>
    <div class="abs cap" id="cap"></div>
    <div id="privacy">
      <div class="row" id="c1" style="top:360px"><div class="big">0</div><div class="lab" id="l1"></div></div>
      <div class="row" id="c2" style="top:760px"><div class="big">0</div><div class="lab" id="l2"></div></div>
      <div class="row" id="c3" style="top:1160px"><div class="big">0</div><div class="lab" id="l3"></div></div>
      <div class="abs cap" id="pvt" style="bottom:170px"></div>
    </div>
    <img class="icon" id="icon" src="../assets/brand/icon.png">
    <div class="abs brand" id="brand">Trace</div>
    <div class="abs sub" id="sub"></div>
    <div class="btn" id="btn"></div>
    <div class="abs fine" id="fine"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const LANG = q.get('lang') === 'zh' ? 'zh' : 'en';
const T = {
  en: { eyebrow: 'iPhone · Photos · Maps', title: ['Walk your photos', 'back across', 'the map.'],
    cap1: ['Photos light up,', 'one by one.', 'In the order you took them.'], cap2: ['Tilt into 3D.', 'Real height.', 'Real route.'], cap3: ['Press play on', 'any trip.', ''],
    names: ['Golden Gate Bridge', 'Bixby Creek Bridge', 'Santa Monica Pier'], imgs: ['goldengate', 'bixby', 'santamonica'],
    l1: 'accounts', l2: 'ads', l3: 'uploads', pvt: ['Your photos never', 'leave your iPhone.'],
    sub: 'Walk your photos back across the map.', btn: 'Download on the App Store', fine: 'iPhone & iPad · Free' },
  zh: { eyebrow: 'iPhone · 照片 · 地图', title: ['把照片，', '重新走一遍。'],
    cap1: ['照片一张张亮起，', '按你拍下它们的顺序。', ''], cap2: ['倾入 3D。', '真实的高度，真实的路线。'], cap3: ['任何一段旅程，', '按下播放。', ''],
    names: ['外滩', '西湖断桥', '拙政园'], imgs: ['bund', 'westlake', 'zhuozheng'],
    l1: '账号', l2: '广告', l3: '上传', pvt: ['照片不出', '你的手机。'],
    sub: '把照片，重新走一遍。', btn: '在 App Store 下载', fine: 'iPhone 和 iPad · 免费' }
}[LANG];
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;

/* stars */
const sc = $('#stars').getContext('2d'); const stars = []; let seed = 5; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
for (let i = 0; i < 260; i++) stars.push({ x: rnd() * 1080, y: rnd() * 1920, r: rnd() * 1.8 + .4, p: rnd() * 6.28, s: rnd() * 1.4 + .4 });
function drawStars(t) { sc.clearRect(0, 0, 1080, 1920); stars.forEach(s => { sc.globalAlpha = (.35 + .5 * Math.sin(t * s.s + s.p)) * .85; sc.fillStyle = '#cfe6ff'; sc.beginPath(); sc.arc(s.x, (s.y - t * 6 * s.r) % 1920 + (s.y - t * 6 * s.r < 0 ? 1920 : 0), s.r, 0, 6.283); sc.fill(); }); }

/* text setup */
$('#eyebrow').textContent = T.eyebrow;
const title = $('#title');
T.title.forEach((line, li) => { const d = document.createElement('div'); (LANG === 'zh' ? [line] : line.split(' ')).forEach((w, i, arr) => { const sp = document.createElement('span'); sp.className = 'w'; sp.innerHTML = '<span>' + w + '</span>'; d.appendChild(sp); if (LANG !== 'zh' && i < arr.length - 1) d.appendChild(document.createTextNode(' ')); }); title.appendChild(d); });
const tw = Array.from(title.querySelectorAll('.w > span'));
$('#cap').innerHTML = ''; $('#l1').textContent = T.l1; $('#l2').textContent = T.l2; $('#l3').textContent = T.l3;
$('#pvt').innerHTML = T.pvt.join('<br>'); $('#sub').textContent = T.sub; $('#btn').textContent = T.btn; $('#fine').textContent = T.fine;
['A', 'B', 'C'].forEach((k, i) => { $('#img' + k).src = '../assets/photos/' + T.imgs[i] + '.jpg'; $('#name' + k).textContent = T.names[i]; });
const vStd = $('#vStd'), vSat = $('#vSat'); vStd.src = '../assets/video/' + LANG + '-std.mp4'; vSat.src = '../assets/video/' + LANG + '-sat.mp4';
const route = $('#route'), routeBase = $('#routeBase'), head = $('#head'); const RL = route.getTotalLength(); route.style.strokeDasharray = RL;

function setCap(t) {
  const cap = $('#cap'); let lines = null, a = 0, b = 0;
  if (t >= 5.0 && t < 8.6) { lines = T.cap1; a = 5.0; b = 8.6; }
  else if (t >= 12.6 && t < 18.8) { lines = T.cap2; a = 12.6; b = 18.8; }
  if (!lines) { cap.style.opacity = 0; return; }
  const key = lines.join('|'); if (cap.dataset.k !== key) { cap.dataset.k = key; cap.innerHTML = lines[0] + '<br>' + lines[1] + (lines[2] ? '<small>' + lines[2] + '</small>' : ''); }
  const i = outExpo(prog(t, a, a + .7)), o = 1 - prog(t, b - .5, b);
  cap.style.opacity = Math.min(i, o); cap.style.transform = 'translateY(' + (1 - i) * 60 + 'px)';
}
function seek(v, time) { return new Promise(res => { if (Math.abs(v.currentTime - time) < 0.001) return res(); const done = () => { v.removeEventListener('seeked', done); res(); }; v.addEventListener('seeked', done); v.currentTime = time; setTimeout(res, 800); }); }

window.renderAt = async function (t) {
  drawStars(t);
  // world camera
  const w = $('#world'); const zoom = 1 + .05 * Math.sin(t / 30 * Math.PI) ; w.style.transform = 'scale(' + zoom + ')';
  // route progress
  const rp = inOut(prog(t, .1, 29)); route.style.strokeDashoffset = RL * (1 - rp); const pt = route.getPointAtLength(RL * rp); head.setAttribute('cx', pt.x); head.setAttribute('cy', pt.y);
  $('#svg').style.opacity = t < 25 ? .95 : 1 - prog(t, 25, 26) * .5;
  // title beat A
  const eb = $('#eyebrow'); eb.style.opacity = outExpo(prog(t, .1, .7)) * (1 - prog(t, 3.4, 3.9)); eb.style.transform = 'translateY(' + (1 - outExpo(prog(t, .1, .7))) * 30 + 'px)';
  tw.forEach((s, i) => { const a = .35 + i * .14; s.style.transform = 'translateY(' + (1 - outExpo(prog(t, a, a + .9))) * 118 + '%)'; });
  const tOut = inOut(prog(t, 3.5, 4.4)); title.style.opacity = 1 - tOut; title.style.transform = 'translateY(' + -tOut * 220 + 'px) scale(' + (1 - tOut * .08) + ')';
  // phone
  const ph = $('#phone'), gl = $('#glow');
  const pin = outExpo(prog(t, 4.0, 5.3)), pout = inOut(prog(t, 19.2, 20.4));
  let y = (1 - pin) * 1100 + pout * 900, sx = lerp(.86, 1, pin) * (1 - pout * .25), rot = 0, rotY = 0;
  if (t > 12 && t < 19.5) { const k = inOut(prog(t, 12, 14)) * (1 - inOut(prog(t, 18, 19.5))); rotY = -14 * k; rot = 3 * k; }
  ph.style.transform = 'translateY(' + y + 'px) scale(' + sx + ') perspective(2200px) rotateY(' + rotY + 'deg) rotateZ(' + rot + 'deg)';
  ph.style.opacity = t < 4.0 ? 0 : 1 - pout; gl.style.opacity = (t < 4.0 ? 0 : 1) * (1 - pout) * (.6 + .4 * Math.sin(t));
  // videos: std 4.2..12.4 -> clip 0.8..9.0 ; sat 12.4..19.6 -> clip 2.2..9.4
  const sw = prog(t, 12.0, 12.8); vSat.style.opacity = sw;
  if (t >= 4.0 && t < 13) await seek(vStd, 0.8 + Math.max(0, t - 4.2));
  if (t >= 12 && t < 20.5) await seek(vSat, 2.2 + Math.max(0, t - 12.4));
  // chips
  const chips = [['#chipA', 6.0, 10.4, 40, 380, -7], ['#chipB', 8.2, 12.2, 700, 1120, 6], ['#chipC', 10.4, 13.0, 90, 1300, -4]];
  chips.forEach(([id, a, b, x, yy, r]) => { const el = $(id); const i = outBack(prog(t, a, a + .8)), o = 1 - prog(t, b - .5, b); const vis = Math.min(1, i) * o; el.style.opacity = vis; el.style.left = x + 'px'; el.style.top = (yy + (1 - Math.min(1, i)) * 80 + Math.sin(t * 1.6 + x) * 8) + 'px'; el.style.transform = 'rotate(' + r + 'deg) scale(' + (.7 + .3 * Math.min(1.05, i)) + ')'; });
  setCap(t);
  // privacy beat
  const pv = $('#privacy'); pv.style.opacity = prog(t, 19.8, 20.2) * (1 - prog(t, 25.0, 25.5));
  [['#c1', 20.3], ['#c2', 21.0], ['#c3', 21.7]].forEach(([id, a]) => { const i = outBack(prog(t, a, a + .6)); const el = $(id); el.style.opacity = prog(t, a, a + .2); el.style.transform = 'scale(' + (.4 + .6 * Math.min(1.08, i)) + ')'; });
  const pt2 = outExpo(prog(t, 22.6, 23.4)); $('#pvt').style.opacity = pt2; $('#pvt').style.transform = 'translateY(' + (1 - pt2) * 70 + 'px)';
  // outro
  const ic = outBack(prog(t, 25.4, 26.2)), b1 = outExpo(prog(t, 26.0, 26.9)), b2 = outExpo(prog(t, 26.5, 27.4)), b3 = outBack(prog(t, 27.0, 27.9)), b4 = outExpo(prog(t, 27.8, 28.6));
  $('#icon').style.opacity = prog(t, 25.4, 25.8); $('#icon').style.transform = 'scale(' + ic + ')';
  $('#brand').style.opacity = b1; $('#brand').style.transform = 'translateY(' + (1 - b1) * 50 + 'px)';
  $('#sub').style.opacity = b2; $('#sub').style.transform = 'translateY(' + (1 - b2) * 40 + 'px)';
  $('#btn').style.opacity = prog(t, 27.0, 27.4); $('#btn').style.transform = 'translateX(-50%) scale(' + Math.min(1.04, b3) + ')';
  $('#fine').style.opacity = b4 * .9;
  // fade out + in
  $('#stage').style.opacity = Math.min(prog(t, 0, .35), 1 - prog(t, 29.4, 30));
  return true;
};
window.filmReady = Promise.all([document.fonts.ready, new Promise(r => { let n = 0; [vStd, vSat].forEach(v => v.addEventListener('loadeddata', () => { if (++n === 2) r(); })); })]);
window.renderAt(0);
</script>
</body>
</html>
